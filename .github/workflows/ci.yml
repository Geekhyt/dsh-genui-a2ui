name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 26
          - os: windows-latest
            node: 26
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 22
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node }} LTS
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build Host & 4-Chunk Client Bundles
        run: npm run build

      - name: Run Test Suite (including Bundle Size Gate)
        run: npm test

      - name: Verify npm Tarball Contents
        run: npm pack --dry-run
