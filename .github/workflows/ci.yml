name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Build & Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build Host & 4-Chunk Client Bundles
        run: npm run build

      - name: Run Test Suite (including Bundle Size Gate)
        run: npm test

      - name: Verify npm Tarball Contents
        run: npm pack --dry-run
