name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 26
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 26
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 22
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node }} LTS
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Format Check
        run: npx biome format .

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build Host & 4-Chunk Client Bundles
        run: npm run build

      - name: Verify 5-Chunk Bundle Budget (Raw + Gzip)
        run: npm run check:bundle

      - name: Verify TLA+ Specifications
        run: npm run verify:tla

      - name: Run Test Suite (including Bundle, Invariants & Deterministic Replay)
        run: npm test

      - name: Verify Offline Eval KPI Thresholds
        run: npm run eval:check

      - name: Verify npm Tarball Contents
        run: npm pack --dry-run --ignore-scripts
