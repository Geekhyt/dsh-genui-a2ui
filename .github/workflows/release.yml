name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, Publish to npm & Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 26 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Release workflow must run on a v* git tag (got ${GITHUB_REF_TYPE}: ${GITHUB_REF_NAME})."
            exit 1
          fi
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Git tag (${GITHUB_REF_NAME}) does not match package.json version (v${PKG_VERSION})."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Cache TLA+ TLC Tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/tla
          key: tla2tools-v1.7.4

      - name: Lint, Typecheck, Build, Budgets, TLA+ & Test
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npm run check:bundle
          npm run verify:tla:strict
          npm test
          npm run eval:check

      - name: Publish to npm (OIDC Trusted Publisher or NPM_TOKEN)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "dsh-genui-a2ui@${PKG_VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "dsh-genui-a2ui@${PKG_VERSION} is already published on npm; skipping npm publish."
          else
            if [ -n "${NPM_TOKEN}" ]; then
              npm config set "//registry.npmjs.org/:_authToken" "${NPM_TOKEN}"
            fi
            npm publish --ignore-scripts --provenance --access public --registry=https://registry.npmjs.org/
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              echo "GitHub Release ${GITHUB_REF_NAME} already exists; skipping."
              exit 0
            fi
            if gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag; then
              exit 0
            fi
            if [ "${attempt}" -eq 5 ]; then
              echo "::error::Failed to create GitHub Release ${GITHUB_REF_NAME} after 5 attempts."
              exit 1
            fi
            delay=$((attempt * 10))
            echo "::warning::gh release create failed (attempt ${attempt}/5); retrying in ${delay}s..."
            sleep "${delay}"
          done
