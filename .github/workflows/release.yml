name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, Publish to npm & Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 26 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Git tag (${GITHUB_REF_NAME}) does not match package.json version (v${PKG_VERSION})."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint, Typecheck, Build & Test
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npm test

      - name: Pack release tarball
        run: |
          TARBALL="$(npm pack --ignore-scripts --json | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].filename)")"
          echo "TARBALL=${TARBALL}" >> "${GITHUB_ENV}"

      - name: Publish to npm (OIDC Trusted Publisher or NPM_TOKEN)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            npm config set "//registry.npmjs.org/:_authToken" "${NPM_TOKEN}"
          fi
          npm publish "${TARBALL}" --provenance --access public --registry=https://registry.npmjs.org/

      - name: Create GitHub Release with tarball asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${TARBALL}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${TARBALL}" --generate-notes --verify-tag
          fi
